name: frontend

description: "Farmora Flutter Frontend"

publish_to: 'none'


version: 1.0.0+1


environment:
  sdk: ^3.13.3



dependencies:

  flutter:
    sdk: flutter


  # API communication
  http: ^1.5.0


  # Supabase Authentication + Database
  supabase_flutter: ^2.8.0


  # Map integration
  flutter_map: ^8.3.2
  latlong2: ^0.9.1


  # Image picker
  image_picker: ^1.2.3


  # Flutter icons
  cupertino_icons: ^1.0.8


  # Localization
  flutter_localizations:
    sdk: flutter


  # PDF Viewer (keep for backup)
  syncfusion_flutter_pdfviewer: ^34.2.7




dev_dependencies:

  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0





flutter:

  uses-material-design: true


  assets:

    # All Farmora assets
    - assets/


    # Images folder
    - assets/images/


    # Terms PDF backup
    - assets/terms/terms_and_conditions.pdf